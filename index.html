<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Laviz Pandey — full-stack developer in Kathmandu. Backend architecture, relational data and React interfaces, owned end to end. Open to full-stack roles."
    />
    <meta name="theme-color" content="#244ce8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600&text=%E0%A4%95%E0%A4%BE%E0%A4%A0%E0%A4%AE%E0%A4%BE%E0%A4%A1%E0%A5%8C%E0%A4%81&display=swap"
    />
    <title>Laviz Pandey — Full Stack Developer</title>
    <script>
      (function () {
        var root = document.documentElement;
        // Marks that scripting is live, so the reveal states in styles.css can
        // hide content up front. Without JS nothing is ever hidden.
        root.classList.add('js');
        // Watchdog: the app sets `ready` within a frame of mounting. If it
        // never does — bundle failed to load, script error, blocked origin —
        // drop `js` again so every hidden reveal falls back to visible rather
        // than leaving the page blank below the hero.
        setTimeout(function () {
          if (!root.classList.contains('ready')) root.classList.remove('js');
        }, 3000);
        try {
          var stored = window.localStorage.getItem('lavizp-theme');
          var theme =
            stored === 'light' || stored === 'dark' ? stored : 'light';
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {
          root.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
